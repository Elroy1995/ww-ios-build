# Replace the ENTIRE contents of .github/workflows/build-ipa.yml with this file.
# Untested. The compile is too long for one 6-hour job, so this saves its progress
# (build/ and ref/) at ~5.5 hours and the next run picks up where it stopped.
# Run it again and again until the run finishes green and has an artifact.
#
# Secrets needed: DISC_URL (Google Drive link) and IPA_PASSPHRASE.
name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Show and free disk space
        run: |
          df -h /
          sudo rm -rf "$HOME/Library/Android" || true
          xcrun simctl delete all || true
          df -h /

      - name: Install tools
        run: brew install cmake ninja p7zip

      - name: Restore build progress
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            ref
          key: ww-build-none
          restore-keys: |
            ww-build-

      - name: Download disc image
        env:
          DISC_URL: ${{ secrets.DISC_URL }}
        run: |
          pip3 install --break-system-packages --upgrade gdown
          FILE_ID=$(echo "$DISC_URL" | sed -E 's#.*/d/([^/]+).*#\1#')
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O "$RUNNER_TEMP/disc.iso"
          ls -lh "$RUNNER_TEMP/disc.iso"

      # Makes the repo's own files look old so the build doesn't think
      # everything changed and recompile what it already finished.
      - name: Mark repo files as old
        run: git ls-files -z | xargs -0 touch -t 202601010000

      - name: Build IPA
        id: build
        timeout-minutes: 325
        run: |
          scripts/builder/build.sh "$RUNNER_TEMP/disc.iso" \
            --ipa build/BlueWake.ipa --no-train

      - name: Save build progress
        if: ${{ always() && steps.build.outcome != 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build
            ref
          key: ww-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake
          path: build/BlueWake.ipa
          retention-days: 1
